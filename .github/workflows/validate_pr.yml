name: Validate PR
on:
  pull_request:
    branches: [ master ]
concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    steps:
      - name: Setup Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '11'
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent && break
            sleep 2
          done
      - name: Generate test configuration
        run: |
          ./scripts/create_configuration.sh
          test -f "$HOME/.bahmni-reports/bahmni-reports-test.properties"
      - name: Provision test databases
        run: |
          sh src/test/resources/create_db.sh || echo "create_db.sh reported failure, checking actual state"
          test "$(mysql --protocol tcp -uroot -proot -e 'SHOW TABLES IN reports_integration_tests' | wc -l)" -gt 0
          test "$(mysql --protocol tcp -uroot -proot -e 'SHOW TABLES IN bahmni_reports_it' | wc -l)" -gt 0
      - name: Test and build package
        run: ./mvnw -T 4 --no-transfer-progress clean install -U
